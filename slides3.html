<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ورشة صناعة البورتفوليو — اليوم الثالث | دلّني</title>
  <meta name="description" content="ورشة صناعة البورتفوليو — اليوم الثالث: من المحتوى الاستراتيجي إلى التصميم النهائي. المدرب عبد الرحمن العظم.">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <div class="grid-overlay"></div>

  <header class="topbar" aria-label="أدوات العرض">
    <div class="brand-lockup">
      <img src="assets/dollani.png" alt="شعار دلّني" class="brand-logo" />
      <div class="brand-copy">
        <strong>دلّني Bootcamp</strong>
        <span>بدعم من المنتدى السوري</span>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="notesBtn" title="إظهار ملاحظات المدرب (N)">ملاحظات</button>
      <button class="icon-btn" id="fullscreenBtn" title="ملء الشاشة (F)">ملء الشاشة</button>
    </div>
  </header>

  <main id="deck" class="deck" tabindex="0" aria-live="polite"></main>

  <aside id="notesPanel" class="notes-panel" aria-hidden="true">
    <div class="notes-head">
      <div>
        <div class="mini-label">ملاحظات المدرب</div>
        <h2 id="notesTitle">—</h2>
      </div>
      <button class="close-notes" id="closeNotes" aria-label="إغلاق الملاحظات">×</button>
    </div>
    <p id="notesBody">—</p>
    <div class="shortcut-list">
      <div><kbd>←</kbd><span>الشريحة السابقة</span></div>
      <div><kbd>→</kbd><span>الشريحة التالية</span></div>
      <div><kbd>N</kbd><span>ملاحظات المدرب</span></div>
      <div><kbd>F</kbd><span>ملء الشاشة</span></div>
    </div>
  </aside>

  <nav class="controls" aria-label="التنقل بين الشرائح">
    <button id="prevBtn" class="nav-btn" title="السابق">←</button>
    <div class="progress-wrap">
      <span id="counter">01 / 28</span>
      <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
    </div>
    <button id="nextBtn" class="nav-btn primary" title="التالي">→</button>
  </nav>

  <div class="hint">اسهم الكيبورد للتنقل · Space للتالي · N للملاحظات · F لملء الشاشة</div>

  <script src="app.js"></script>
</body>
</html>
